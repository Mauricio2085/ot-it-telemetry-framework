name: contracts

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install 'jsonschema[format]==4.23.0'
      - run: python scripts/check-contracts.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/check-profile.js
