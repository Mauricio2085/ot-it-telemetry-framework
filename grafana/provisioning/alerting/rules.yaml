apiVersion: 1

groups:
  - orgId: 1
    name: asset-condition
    folder: IIoT
    interval: 30s
    rules:
      - uid: asset_condition_band
        title: Asset condition out of band
        condition: D
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: timescaledb
            model:
              datasource:
                type: grafana-postgresql-datasource
                uid: timescaledb
              editorMode: code
              format: time_series
              rawQuery: true
              rawSql: |-
                SELECT NOW() AS time,
                       asset_id,
                       signal,
                       condition,
                       value_avg AS value
                FROM asset_condition
                WHERE condition IN ('warning', 'alarm')
                  AND value_avg IS NOT NULL
              refId: A
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: abs($B)
              refId: C
              type: math
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: D
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: C
              refId: D
              type: threshold
              intervalMs: 1000
              maxDataPoints: 43200
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - D
                  reducer:
                    type: last
                  type: query
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: '{{ $labels.asset_id }} {{ $labels.signal }} is {{ $labels.condition }} at {{ $values.B.Value }}'
        labels:
          source: asset_condition
        isPaused: false
